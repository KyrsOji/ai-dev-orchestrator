name: Taskboard SSE live smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  sse-smoke:
    name: Taskboard SSE live smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/taskboard-widget
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (with deps)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test followups
        run: npm run test:followups

      - name: Test render-safe
        run: npm run test:render-safe

      - name: Run SSE smoke (PORT=3011)
        env:
          PORT: 3011
        run: PORT=3011 npm run test:sse-live:local

      # Upload artifacts on failure
      - name: Upload playwright screenshot (desktop) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshot-desktop
          path: /tmp/playwright-screenshot-desktop.png
          if-no-files-found: warn

      - name: Upload playwright screenshot (tablet) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshot-tablet
          path: /tmp/playwright-screenshot-tablet.png
          if-no-files-found: warn

      - name: Upload playwright screenshot (mobile) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshot-mobile
          path: /tmp/playwright-screenshot-mobile.png
          if-no-files-found: warn

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taskboard-sse-smoke-server-log
          path: /tmp/taskboard-sse-smoke-server.log
          if-no-files-found: warn
