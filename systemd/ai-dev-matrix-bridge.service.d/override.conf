[Service]
# Ensure the daemon runs from the deployed code path and can import the module
WorkingDirectory=/opt/ai-dev-orchestrator
Environment=PYTHONPATH=/opt/ai-dev-orchestrator
# Ensure kafka console tools are found when the service starts
Environment=PATH=/home/kojiyah/tools/kafka/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
# Kafka connectivity (set here or via the EnvironmentFile)
Environment=KAFKA_BOOTSTRAP=kafka.yahlife.com:9095
Environment=KAFKA_CLIENT_CONFIG=/opt/ai-dev-runner/certs/kafka-client.properties
# Load sensitive values (MATRIX_*) from a file. Create /etc/ai-dev-orchestrator/matrix.env
# with entries like: MATRIX_ACCESS_TOKEN=..., MATRIX_HOMESERVER_URL=..., MATRIX_ROOM_ID=...
EnvironmentFile=/etc/ai-dev-orchestrator/matrix.env
# Override ExecStart to include --daemon so systemd launches long-running consumer
ExecStart=
ExecStart=/usr/bin/python3 -m matrix_bridge.bridge --config ${CONFIG_PATH} --matrix-mode real --daemon
