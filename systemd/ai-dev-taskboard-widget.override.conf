[Service]
Environment=RUN_BASE=/var/lib/ai-dev-runner/openhands-runs
Environment=RESULTS_FILE=/var/lib/ai-dev-runner/taskboard-results.json
# NOTE: This file mirrors the live systemd drop-in created under /etc for the taskboard widget.
# To configure TASKBOARD_API_TOKEN securely (DO NOT commit the token here):
# 1) Create a secure file, e.g. /etc/ai-dev-orchestrator/taskboard.env, with a line:
#    TASKBOARD_API_TOKEN=<your-token-here>
# 2) Ensure the service drop-in under /etc/systemd/system/ai-dev-taskboard-widget.service.d/ contains:
#    EnvironmentFile=/etc/ai-dev-orchestrator/taskboard.env
# Alternatively, set Environment=TASKBOARD_API_TOKEN=<value> in the drop-in (not recommended for secrets).
# After updating the drop-in: sudo systemctl daemon-reload && sudo systemctl restart ai-dev-taskboard-widget
